# I-JEPA pretraining (arXiv:2301.08243). Override any key from the command line:
#   python -m iecdt_hackathon.train_ijepa --set training.steps=200 --set model.arch=vit_tiny

data:
  train_dir: /gws/ssde/j25b/iecdt/modis_hackathon/train
  val_dir: /gws/ssde/j25b/iecdt/modis_hackathon/val
  stats_path: /gws/ssde/j25b/iecdt/modis_hackathon/stats/modis_band_stats.json
  labels_path: /gws/ssde/j25b/iecdt/modis_hackathon/labels/val_labels.nc

  bands: ["1", "3", "4", "29", "31", "32"]
  include_land_mask: false
  # Solar zenith angle is a smooth near-linear ramp across a tile, which is a
  # cheap shortcut for any label correlated with viewing geometry. Left off so
  # the encoder has to learn cloud physics instead.
  include_solar_zenith: false

  # Full tiles, not crops. The probes see whole 256x256 tiles, and the run is
  # I/O-bound (~258 tiles/s on 8 workers against ~16 steps/s of ViT-S compute),
  # so a 128 crop would cut FLOPs 4x for no wall-clock gain and 4x less signal
  # per step. 256/16 = a 16x16 = 256 token grid, as the paper's 224/14.
  crop_size: null

  # Validation tiles for the in-loop probe. Keep this fixed across runs, or the
  # scores stop being comparable: fewer fitting rows systematically lowers R^2.
  n_val_tiles: 4000

  # 'ram_uint8' holds the whole training split in memory (39 GB, ~5 min
  # pre-pass) and removes the I/O bottleneck entirely: ~16 steps/s instead of
  # ~2. Turn it on once a plain run is confirmed healthy.
  cache: none

model:
  name: ijepa
  arch: vit_small          # vit_tiny | vit_small | vit_base
  patch_size: 16
  pred_depth: 6
  pred_emb_dim: 192        # narrow on purpose -- see VisionTransformerPredictor
  pred_num_heads: 3
  pool: mean_std           # D = 768. Training also writes mean/mean4/mean4std.
  encode_from: target      # the only encoder ever fed full unmasked tiles
  input_shift: null        # optional per-band affine before the patch embedding
  input_scale: null

mask:
  enc_mask_scale: [0.85, 1.0]
  pred_mask_scale: [0.15, 0.2]
  aspect_ratio: [0.75, 1.5]
  nenc: 1
  npred: 4
  # The reference's single min_keep=10 is tuned for a 14-patch grid; on this
  # 16-patch grid, with target blocks around 44 patches, it never binds.
  min_keep_enc: 64
  min_keep_pred: 16
  allow_overlap: false

augment:
  # Flips and quarter turns, all channels together. No resizing (it changes
  # km/pixel) and nothing photometric (radiance magnitude is the label).
  d4: true

training:
  run_dir: runs/ijepa
  steps: 60000             # ~8.3 h at the measured 2.0 steps/s on 8 CPUs
  max_seconds: 37800       # 10.5 h stop, so the final probe and checkpoints run
  batch_size: 128

  # The reference's peak lr of 1e-3 is for a *global* batch of 2048 (128 x 16
  # GPUs). At batch 128, sqrt scaling puts the equivalent near 2.5e-4. Copying
  # 1e-3 across is a reliable way to collapse the run; drop to 1.5e-4 if the
  # loss spikes.
  lr: 3.0e-4
  start_lr: 6.0e-5
  final_lr: 1.0e-6
  warmup_frac: 0.1         # the reference's 40 of 300 epochs

  weight_decay: 0.04       # note: RISES to final_weight_decay over the run
  final_weight_decay: 0.4
  ema: [0.996, 1.0]        # also rises; the target encoder freezes at the end
  grad_clip: 1.0

  num_workers: 14          # 16 allocated CPUs, less the main process and probe
  amp_dtype: bfloat16
  device: cuda
  seed: 0

  log_every: 50
  probe_every: 2000        # ~20 s: 4000 tiles + 3 OLS probes, ~1.5% overhead
  collapse_every: 500
  val_batches: 20
  wandb_project: iecdt-hackathon
  # auto -> offline inside a SLURM job (orchid nodes have no outbound
  # network), online on a login node. online | offline | disabled to force.
  wandb_mode: auto
