# Baseline conv-autoencoder run. Override any key from the command line, e.g.
#   python -m iecdt_hackathon.train --set training.steps=5000 --set model.embedding_dim=512

data:
  train_dir: /gws/ssde/j25b/iecdt/modis_hackathon/train
  val_dir: /gws/ssde/j25b/iecdt/modis_hackathon/val
  stats_path: /gws/ssde/j25b/iecdt/modis_hackathon/stats/modis_band_stats.json

  # Channel order the model receives. 1/3/4 are visible red/blue/green,
  # 29/31/32 are thermal infrared.
  bands: ["1", "3", "4", "29", "31", "32"]
  include_land_mask: false
  include_solar_zenith: false

  # Random crop for training. 128 quadruples throughput over the full 256
  # tile. Note that the probes see whole 256x256 tiles, so a model trained on
  # crops has to generalise across scale -- set this to 256 (or null) if you
  # would rather not rely on that.
  crop_size: 128

  # Validation tiles used for the reconstruction loss during training. The
  # linear probes in evaluate.py use the whole split regardless.
  n_val_tiles: 2000

model:
  name: conv_autoencoder
  embedding_dim: 256
  width: 32
  seed_size: 8

training:
  run_dir: runs/baseline
  steps: 20000
  batch_size: 64
  lr: 2.0e-4
  weight_decay: 0.01
  warmup_steps: 500
  grad_clip: 1.0
  num_workers: 8
  amp_dtype: bfloat16
  device: cuda
  seed: 0
  log_every: 50
  val_every: 1000
  val_batches: 20
  wandb_project: iecdt-hackathon
  # auto -> offline inside a SLURM job (orchid nodes have no outbound
  # network), online on a login node. online | offline | disabled to force.
  wandb_mode: auto
